[loggers]
keys=root,brand_visibility
[handlers]
keys=console
[formatters]
keys=standard
[logger_root]
level=INFO
handlers=console
[logger_brand_visibility]
level=INFO
handlers=console
qualname=brand_visibility
propagate=0
[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)
[formatter_standard]
format=%(asctime)s | %(levelname)s | %(name)s | %(message)s
