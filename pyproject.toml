[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-visibility-intelligence"
version = "1.0.0"
description = "Production-style e-commerce brand visibility analytics pipeline and dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.38", "pandas>=2.1", "numpy>=1.26", "plotly>=5.22", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
